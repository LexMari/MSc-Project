# Finds the visibility threshold below which low_visibility_collision.yaml's
# collision starts happening, rather than relying on the single fixed
# value (0.15).
name: "low_visibility_collision.yaml swept across visibility levels"
base_scenario: "scenarios/low_visibility_collision.yaml"
output_csv: "results/visibility_threshold_sweep.csv"

sweep:
  visibility: [0.10, 0.12, 0.14, 0.16, 0.18, 0.20, 0.22, 0.24, 0.26, 0.28, 0.30, 0.35, 0.40, 0.50, 0.65, 0.80, 1.0]

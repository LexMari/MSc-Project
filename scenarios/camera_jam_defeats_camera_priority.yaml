# Jamming a camera removes its ground truth that it trusts
# This leads to a collision with the pedestrian
name: "Camera jam defeats camera_priority"
duration: 20
timestep: 0.1

track:
  straight_length: 200
  radius: 60
  features:
    - feature_id: "crossing_1"
      feature_type: "pedestrian_crossing"
      position: 150

vehicles:
  - vehicle_id: "solo"
    start_distance: 0
    start_speed_mph: 44.74
    fusion_policy: "camera_priority"

hazards:
  - type: "pedestrian_crossing"
    feature_id: "crossing_1"
    start_time: 0.0
    duration: 20.0

attacks:
  - type: "camera_jam"
    target_vehicle: "solo"
    trigger_before_feature: "crossing_1"
    trigger_distance: 60
    duration: 10.0
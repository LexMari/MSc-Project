# First is already on the roundabout, moving slowly
# Second, approaching at cruise speed, would need to
# brake and come to a full stop in the unattacked baseline
name: "Two attacked vehicles at the roundabout"
duration: 25
timestep: 0.1

vehicles:
  - vehicle_id: "first"
    start_distance: 140
    start_speed_mph: 20
    fusion_policy: "camera_priority"
    gps_policy: "naive"
  - vehicle_id: "second"
    start_distance: 50
    start_speed_mph: 44.74
    fusion_policy: "camera_priority"

attacks:
  - type: "camera_jam"
    target_vehicle: "second"
    trigger_before_feature: "roundabout_1"
    trigger_distance: 100
    duration: 10.0
  - type: "gps_spoof"
    target_vehicle: "first"
    trigger_before_feature: "roundabout_1"
    trigger_distance: 10
    duration: 5.0
    offset: [100.0, 100.0]

# Identical attack to multi_sensor_spoof.yaml (radar and LiDAR spoofed
# together, defeating majority_vote and confidence_weighted) but with
# plausibility_filtered instead. Both spoofed sensors jump implausibly
# (58m -> 200m in one tick) and are filtered out. Camera survives with a
# corroboration history from before the attack, so it is trusted completely.
name: "Plausibility-filtered fusion resists multi-sensored spoof attack"
duration: 20
timestep: 0.1

track:
  straight_length: 200
  radius: 60
  features:
    - feature_id: "crossing_1"
      feature_type: "pedestrian_crossing"
      position: 150

vehicles:
  - vehicle_id: "solo"
    start_distance: 0
    start_speed_mph: 44.74
    fusion_policy: "plausibility_filtered"

hazards:
  - type: "pedestrian_crossing"
    feature_id: "crossing_1"
    start_time: 0.0
    duration: 20.0

attacks:
  - type: "radar_spoof"
    target_vehicle: "solo"
    trigger_before_feature: "crossing_1"
    trigger_distance: 60
    duration: 10.0
    spoofed_distance: 200.0
    spoofed_velocity: 0.0
  - type: "lidar_spoof"
    target_vehicle: "solo"
    trigger_before_feature: "crossing_1"
    trigger_distance: 60
    duration: 10.0
    spoofed_distance: 200.0
    spoofed_velocity: 0.0
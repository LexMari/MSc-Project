# Tests whether a fusion policy is fooled by camera_phantom itself
name: "Isolated camera phantom"
duration: 5
timestep: 0.1

track:
  straight_length: 200
  radius: 60
  features: []

vehicles:
  - vehicle_id: "solo"
    start_distance: 0
    start_speed_mph: 45
    fusion_policy: "camera_priority"

attacks:
  - type: "camera_phantom"
    target_vehicle: "solo"
    start_time: 1.0
    duration: 0.5
    phantom_distance: 3.0
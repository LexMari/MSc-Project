# Combines the phantom-induced-swerve mechanism from
# phantom_induced_swerve_collision.yaml with the background traffic
# spawner from background_traffic.yaml

# The danger in this scenario is supposed to be emergent rather than
# deterministic like in other scenarios - depending on the seeded traffic
name: "Attacked vehicle amid background traffic"
duration: 120
timestep: 0.1
random_seed: 0

vehicles:
  - vehicle_id: "solo"
    start_distance: 0
    start_speed_mph: 30
    fusion_policy: "camera_priority"

spawner:
  feature_id: "junction_1"
  max_concurrent: 20
  speed_mph: 20.0
  fusion_policy: "camera_priority"

attacks:
  - type: "camera_phantom"
    target_vehicle: "solo"
    start_time: 90.0
    duration: 3.0
    phantom_distance: 15.0

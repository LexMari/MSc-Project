# A large GPS spoof (offset ~141m) triggers as Solo approaches
# the roundabout. Solo uses the naive GPS policy, which trusts every reading
# so consequently misses the roundabout exit and has to do
# another loop
name: "GPS spoof causes a missed roundabout exit (naive policy)"
duration: 35
timestep: 0.1

vehicles:
  - vehicle_id: "solo"
    start_distance: 0
    start_speed_mph: 44.74
    fusion_policy: "camera_priority"
    gps_policy: "naive"

attacks:
  - type: "gps_spoof"
    target_vehicle: "solo"
    trigger_before_feature: "roundabout_1"
    trigger_distance: 30
    duration: 5.0
    offset: [100.0, 100.0]
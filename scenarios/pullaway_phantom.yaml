# Two vehicles approach a red light together and both stop. Once the
# light turns green and both pull away, the LEAD vehicle is attacked with a
# camera phantom attack 3m after clearing the junction. The follower is
# close behind and has to react to the lead's sudden braking.
name: "Pull-away phantom attack with a close follower"
duration: 30
timestep: 0.1

track:
  straight_length: 150
  radius: 60
  features:
    - feature_id: "junction_1"
      feature_type: "junction"
      position: 413.4955592153876

vehicles:
  - vehicle_id: "follower"
    start_distance: 313.4955592153876
    start_speed_mph: 20
    fusion_policy: "camera_priority"
  - vehicle_id: "lead"
    start_distance: 333.4955592153876
    start_speed_mph: 20
    fusion_policy: "camera_priority"

attacks:
  - type: "camera_phantom"
    target_vehicle: "lead"
    trigger_after_feature: "junction_1"
    trigger_distance: 3
    duration: 1
    phantom_distance: 3.0
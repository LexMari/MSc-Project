# Demonstrates a custom track layout with two junctions, and an
# attack timed against the SECOND one specifically - showing attack
# ignores junction_1 on the way past it and only fires near junction_2.
name: "Custom track with two junctions, attack targets the second"
duration: 20
timestep: 0.1

track:
  straight_length: 150
  radius: 50
  features:
    - feature_id: "junction_1"
      feature_type: "junction"
      position: 80
    - feature_id: "junction_2"
      feature_type: "junction"
      position: 250

vehicles:
  - vehicle_id: "follower"
    start_distance: 0
    start_speed_mph: 30
    fusion_policy: "camera_priority"
  - vehicle_id: "lead"
    start_distance: 50
    start_speed_mph: 30
    fusion_policy: "camera_priority"

attacks:
  - type: "camera_phantom"
    target_vehicle: "follower"
    trigger_before_feature: "junction_2"
    trigger_distance: 30
    duration: 0.5
    phantom_distance: 3.0
# Demonstrates that reduced sensor range alone (fog, heavy rain) can
# still cause a collision, even with a genuine, correctly-perceived
# pedestrian crossing and no attack at all. 'visibility' scales
# MAX_SENSOR_RANGE and LIDAR_MAX_SENSOR_RANGE (engine.py) - at 0.15,
# effective range drops to ~22.5m, too late to brake safely from cruise
# speed. An oncoming vehicle blocks the swerve lane, since detecting a
# hazard too late to brake for doesn't mean too late to steer around it
# - swerving needs far less distance than a full stop, so without
# something blocking that escape route, solo would swerve around the
# pedestrian instead of colliding (see _maybe_swerve in engine.py,
# switched from ground truth to belief-based detection)
name: "Reduced visibility alone causes a collision - no attack required"
duration: 20
timestep: 0.1
visibility: 0.15

track:
  straight_length: 200
  radius: 60
  features:
    - feature_id: "crossing_1"
      feature_type: "pedestrian_crossing"
      position: 150

vehicles:
  - vehicle_id: "solo"
    start_distance: 0
    start_speed_mph: 44.74
    fusion_policy: "camera_priority"
  - vehicle_id: "oncoming"
    start_distance: 200
    start_speed_mph: 15
    lane: 1
    direction: -1
    fusion_policy: "camera_priority"

hazards:
  - type: "pedestrian_crossing"
    feature_id: "crossing_1"
    start_time: 0.0
    duration: 20.0

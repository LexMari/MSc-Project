# No attack - demonstrates that reduced sensor range alone (fog, heavy
# rain) can cause a collision with a real, correctly-perceived
# pedestrian crossing. `visibility` scales MAX_SENSOR_RANGE and
# LIDAR_MAX_SENSOR_RANGE (engine.py) - at 0.15, effective range drops to
# ~22.5m, not enough distance to brake safely from cruise speed
# regardless of fusion policy. Compare against visibility left at its
# default (1.0), which stops safely with room to spare.
name: "Reduced visibility alone causes a collision - no attack required"
duration: 20
timestep: 0.1
visibility: 0.15

track:
  straight_length: 200
  radius: 60
  features:
    - feature_id: "crossing_1"
      feature_type: "pedestrian_crossing"
      position: 150

vehicles:
  - vehicle_id: "solo"
    start_distance: 0
    start_speed_mph: 44.74
    fusion_policy: "camera_priority"

hazards:
  - type: "pedestrian_crossing"
    feature_id: "crossing_1"
    start_time: 0.0
    duration: 20.0
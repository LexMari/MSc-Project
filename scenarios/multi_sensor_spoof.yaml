# Same attack as radar_spoof_masking.yaml but on two sensors at once -
# radar and LiDAR both spoofed to agree on the same fabricated "nothing
# there" distance. Two sensors agreeing on a lie is itself a majority,
# outvoting camera's single correct reading, so majority_vote is
# defeated here despite having three sensors to work with. Shows the
# limitations of majority-vote fusion
name: "Coordinated radar + LiDAR spoof defeats majority_vote"
duration: 20
timestep: 0.1

track:
  straight_length: 200
  radius: 60
  features:
    - feature_id: "crossing_1"
      feature_type: "pedestrian_crossing"
      position: 150

vehicles:
  - vehicle_id: "solo"
    start_distance: 0
    start_speed_mph: 44.74
    fusion_policy: "majority_vote"

hazards:
  - type: "pedestrian_crossing"
    feature_id: "crossing_1"
    start_time: 0.0
    duration: 20.0

attacks:
  - type: "radar_spoof"
    target_vehicle: "solo"
    trigger_before_feature: "crossing_1"
    trigger_distance: 60
    duration: 10.0
    spoofed_distance: 200.0
    spoofed_velocity: 0.0
  - type: "lidar_spoof"
    target_vehicle: "solo"
    trigger_before_feature: "crossing_1"
    trigger_distance: 60
    duration: 10.0
    spoofed_distance: 200.0
    spoofed_velocity: 0.0
